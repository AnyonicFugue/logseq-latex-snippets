name: Build plugin

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "*" # Push events to matching any tag format, i.e. 1.0, 20.15.10

env:
  PLUGIN_NAME: logseq-latex-snippets

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x" # You might need to adjust this value to your own version
      - name: Build
        id: build
        run: |
          npm ci
          npm test
          npm run build
          mkdir ${{ env.PLUGIN_NAME }}
          cp README.md LICENSE package.json icon.png ${{ env.PLUGIN_NAME }}
          cp -R dist ${{ env.PLUGIN_NAME }}/dist
          zip -r ${{ env.PLUGIN_NAME }}.zip ${{ env.PLUGIN_NAME }}
          ls
          echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: ncipollo/release-action@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref }}
        with:
          allowUpdates: true
          draft: false
          prerelease: false
          artifacts: '${{ env.PLUGIN_NAME }}.zip'
